name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Superseded runs on a PR branch are cancelled. Runs on master are never cancelled,
# so every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.12 while .python-version pins 3.14 for local
        # dev; exercise both ends of the supported range.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check src
      - run: uv run ruff format --check src
      # Diagnostics already in .ty/baseline.json are suppressed; new ones fail.
      - run: uv run ty check

  # The Rust terminal client in tui/ only exists on branches that carry it;
  # skip the job entirely where there is no crate to check.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tui: ${{ steps.detect.outputs.tui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        run: echo "tui=$([ -f tui/Cargo.toml ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

  tui:
    needs: detect
    if: needs.detect.outputs.tui == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tui
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
