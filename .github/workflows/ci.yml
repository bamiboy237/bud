name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src
      - run: uv run ruff format --check src
      # Errors already in .basedpyright/baseline.json are tolerated; new ones fail.
      - run: uv run basedpyright
