[package]
name = "bud-tui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Terminal chat client for bud, a personal AI teammate"

[lib]
name = "bud_tui"
path = "src/lib.rs"

[[bin]]
name = "bud-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
