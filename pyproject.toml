[project]
name = "bud"
version = "0.1.0"
description = "A personal AI teammate"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "composio>=0.22.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "photonhq-api>=0.6.0,<0.7",
    "prompt-toolkit>=3.0.40",
    "pydantic>=2.14.3",
    "pydantic-ai-harness[skills]>=0.66.0",
    "pydantic-ai-slim[dbos,mcp,openai]>=2.61.0",
    "pydantic-monty>=1.0.0,<2",
    "pydantic-settings>=2.16.2",
    "python-socketio[asyncio-client]>=5.14,<6",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
bud = "bud.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.101",
]

[tool.ty]
# src/ layout is auto-discovered. Existing diagnostics recorded in the baseline
# are suppressed (preview feature, >=0.0.93); new ones fail `ty check`.
# Regenerate with `uv run ty check --update-baseline`.
baseline = ".ty/baseline.json"
