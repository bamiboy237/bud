# What each tool may do. A tool missing from this file is denied.
#   allow: run without asking
#   ask:   wait for the person's approval
#   deny:  always refuse

[tools]
current_time = "allow"
search_email = "allow"
read_thread = "allow"
list_events = "allow"
search_contacts = "allow"
draft_reply = "allow"
send_email = "ask"
create_event = "ask"
move_event = "ask"
